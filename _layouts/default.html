<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Analytics -->
    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="wrapper">
        <header>
            <div>
                <img src="{{ '/assets/img/andre.jpg' | relative_url }}" alt="André Oliveira" class="profile-img"
                    width="200">
            </div>
            <h1>{{ site.title }}</h1>
            <h2>{{ site.role }}</h2>
            <p>{{ site.description }}</p>
            <div class="social-icons">
                <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="mailto:{{ site.email }}" target="_blank" rel="noopener noreferrer" aria-label="Send email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
            <nav class="menu" aria-label="Primary">
                <a href="{{ '/' | relative_url }}" {% if page.url=='/' or page.url=='/index.html' %}class="active" {%
                    endif %}>Home</a>
                <a href="{{ '/skills/' | relative_url }}" {% if page.url contains '/skills' %}class="active" {% endif
                    %}>Skills</a>
                <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}class="active" {% endif
                    %}>Projects</a>
            </nav>
            <div class="resume">
                <a href="{{ '/resume/' | relative_url }}" target="_blank" rel="noopener noreferrer">View Resume (Printable)</a>
            </div>
        </header>
        <section id="main-content">
            {{ content }}
        </section>
        <footer>
            <span>&copy; {{ site.time | date: '%Y' }} André Oliveira. All rights reserved.</span>
        </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
</body>

</html>
